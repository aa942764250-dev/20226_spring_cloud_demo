apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: springcloud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: swr.cn-north-4.myhuaweicloud.com/springcloud-demo/nacos:v2.2.3
          env:
            - name: MODE
              value: standalone
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 256m
          ports:
            - containerPort: 8848
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: springcloud-demo
spec:
  selector:
    app: nacos
  ports:
    - port: 8848
      targetPort: 8848