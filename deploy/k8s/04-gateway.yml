apiVersion: apps/v1
kind: Deployment
metadata:
  name: springcloud-gateway
  namespace: springcloud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springcloud-gateway
  template:
    metadata:
      labels:
        app: springcloud-gateway
    spec:
      containers:
        - name: springcloud-gateway
          image: swr.cn-north-4.myhuaweicloud.com/springcloud-demo/springcloud-gateway:1.0.0
          env:
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: nacos.springcloud-demo.svc.cluster.local:8848
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: springcloud-gateway
  namespace: springcloud-demo
spec:
  type: LoadBalancer
  selector:
    app: springcloud-gateway
  ports:
    - port: 8080
      targetPort: 8080