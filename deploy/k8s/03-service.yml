apiVersion: apps/v1
kind: Deployment
metadata:
  name: springcloud-service
  namespace: springcloud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springcloud-service
  template:
    metadata:
      labels:
        app: springcloud-service
    spec:
      containers:
        - name: springcloud-service
          image: swr.cn-north-4.myhuaweicloud.com/springcloud-demo/springcloud-service:1.0.0
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.springcloud-demo.svc.cluster.local:3306/springcloud_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: nacos.springcloud-demo.svc.cluster.local:8848
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /user/list
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: springcloud-service
  namespace: springcloud-demo
spec:
  selector:
    app: springcloud-service
  ports:
    - port: 8081
      targetPort: 8081