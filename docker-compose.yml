version: '3.8'

# 本地 Docker 容器化部署（6 服务：网关 + 3 后端 + 2 前端）—— 连服务器 MySQL + Nacos
# - 数据库/模型配置连服务器 MySQL(154.201.68.122:3306) + Nacos(154.201.68.122:8848, dev 命名空间)
# - 后端：gateway(8080) / workbench-service(8083) / ai-teacher-service(8084) 经网关 lb:// 路由；
#         springcloud-service(8081) 是「工作台」后端，工作台前端 /api 直连它（避开网关 /api/wb 路由冲突）
# - 前端（两个，均容器内 nginx，仅暴露宿主机端口）：
#     工作台  -> http://localhost:8090  (根 Project_009_工作台门户前端，/api 直连 springcloud-service:8081)
#     AI教师  -> http://localhost:8088  (Project_008/frontend，/api 走网关 gateway:8080)
# - 远程服务器部署请改用 docker-compose.server.yml（master 命名空间）
# 构建并启动：docker compose up -d --build
# 账号 admin / 123456
# 停止：docker compose down

services:
  gateway:
    build:
      context: ./springcloud-gateway
      dockerfile: Dockerfile
    container_name: wb-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GATEWAY_JWT_SECRET=workbench-secret-key-must-be-at-least-256-bits-long-please-change
    networks:
      - wb-net

  workbench-service:
    build:
      context: ./workbench-service
      dockerfile: Dockerfile
    container_name: wb-workbench
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - WORKBENCH_JWT_SECRET=workbench-secret-key-must-be-at-least-256-bits-long-please-change
    depends_on:
      - gateway
    networks:
      - wb-net

  ai-teacher-service:
    build:
      context: ./ai-teacher-service
      dockerfile: Dockerfile
    container_name: wb-ai-teacher
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # 教材原文图片根目录（容器内），由下方 volumes 挂载提供
      - TEXTBOOK_IMAGE_BASE_DIR=/data/textbook
      # Embedding API Key（知识库检索用，硅基流动 bge-m3）
      - EMBEDDING_API_KEY=sk-efnumzkzwdflbdvyrcfbqmnbttnxgwbcfclfticapqjhhxrc
    volumes:
      # 宿主机教材原文目录（含中文名），只读挂载进容器
      - "D:/Workspace/Project_010_英语知识库/data/教材原文:/data/textbook:ro"
    depends_on:
      - gateway
    networks:
      - wb-net

  workbench-web:
    build:
      context: ../Project_008_AI英语教师工作台/frontend
      dockerfile: Dockerfile
    container_name: wb-web
    ports:
      - "8088:80"
    depends_on:
      - gateway
    networks:
      - wb-net

  # 「工作台」后端：springcloud-service(8081)，连服务器 Nacos(dev)+远程 MySQL
  springcloud-service:
    build:
      context: ./springcloud-service
      dockerfile: Dockerfile
    container_name: wb-springcloud-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - wb-net

  # 「工作台」前端（根 Project_009_工作台门户前端）：/api 直连 springcloud-service:8081
  workbench-portal:
    build:
      context: ../Project_009_工作台门户前端
      dockerfile: Dockerfile
      args:
        - VITE_AI_TEACHER_URL=http://localhost:8088
    container_name: wb-portal
    ports:
      - "8090:80"
    depends_on:
      - springcloud-service
    networks:
      - wb-net

networks:
  wb-net:
    driver: bridge
