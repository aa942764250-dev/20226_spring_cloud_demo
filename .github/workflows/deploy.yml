name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'springcloud-service/**'
      - 'springcloud-common/**'
      - 'springcloud-api/**'
      - 'pom.xml'
      - 'Project_003_QueryFrontend/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend
        run: mvn package -pl springcloud-service -am -DskipTests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Project_003_QueryFrontend/package-lock.json

      - name: Build frontend
        run: |
          cd Project_003_QueryFrontend
          npm ci
          npm run build

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: |
            springcloud-service/target/springcloud-service-1.0.0-SNAPSHOT.jar
            springcloud-service/Dockerfile
            Project_003_QueryFrontend/dist/**
          target: /opt/springcloud-demo/

      - name: Restart services via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/springcloud-demo

            # rebuild and restart backend
            cd springcloud-service
            docker build -t springcloud-service:latest .
            docker stop springcloud-service 2>/dev/null || true
            docker rm springcloud-service 2>/dev/null || true
            docker run -d \
              --name springcloud-service \
              --network app-net \
              -e SPRING_PROFILES_ACTIVE=master \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://154.201.68.122:3306/springcloud_demo?useSSL=false\&characterEncoding=utf8\&serverTimezone=Asia/Shanghai\&allowPublicKeyRetrieval=true \
              -e SPRING_DATASOURCE_USERNAME=app_user \
              -e SPRING_DATASOURCE_PASSWORD=App@Remote2026#User \
              -e SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=154.201.68.122:8848 \
              -e SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=master \
              -e SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos \
              -e SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos \
              -p 8081:8081 \
              springcloud-service:latest

            # reload frontend
            docker cp /opt/springcloud-demo/Project_003_QueryFrontend/dist/. query-frontend:/usr/share/nginx/html/ 2>/dev/null || true
            docker exec query-frontend nginx -s reload 2>/dev/null || true

            echo "Deploy done at $(date)"