server:
  port: 8081

spring:
  application:
    name: springcloud-service
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

encrypt:
  init:
    default-algorithm: SM4
    default-batch-size: 1000
    default-batch-interval-ms: 0
    default-skip-encrypted: true
    db-retry:
      max-attempts: 3
      retry-interval-ms: 5000
    batch-timeout-seconds: 30
    algorithm-prefix-separator: ":"

logging:
  level:
    com.example.service: debug

encrypt-lite:
  enabled: false
  default-batch-size: 200
  config-path: ${ENCRYPT_LITE_CONFIG_PATH:}
  secret-key: ${DATA_INIT_ENCRYPT_KEY:}

review:
  python-path: C:\Users\黄\AppData\Local\Programs\Python\Python312\python.exe
  kb-script-path: D:\Workspace\Project_006_LocalKnowledgeMCP\kb.py
  kb-server-url: http://127.0.0.1:9876
  search-timeout-seconds: 30
  enabled: true

ai-teacher:
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: gemini-2.5-flash
  timeout-seconds: 60
  max-retries: 2
  default-teacher-id: 1
