<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 查询工具</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #2a2a3c;
    --panel-hover: #313145;
    --border: #3d3d52;
    --text: #e0e0e8;
    --text-soft: #a0a0b8;
    --text-dim: #6c6c80;
    --accent: #82b1ff;
    --accent-2: #4dd0e1;
    --success: #81c784;
    --warn: #ffb74d;
    --error: #e57373;
    --code-bg: #1a1a28;
    --table-head: #252538;
    --table-row-alt: #252538;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Consolas', 'Monaco', 'Microsoft YaHei', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; font-weight: 600; color: var(--accent); }
  .status { font-size: 12px; color: var(--text-dim); }
  .status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); margin-right: 6px; vertical-align: middle;
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .btn {
    padding: 6px 14px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-soft);
    border-radius: 4px; cursor: pointer; font-size: 12px;
    font-family: inherit; transition: all .15s;
  }
  .btn:hover { background: var(--panel-hover); color: var(--text); border-color: var(--accent); }
  .btn-primary {
    background: var(--accent); color: #0a0a14; border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { background: #9ec6ff; }
  .btn-danger { color: var(--error); border-color: var(--error); }
  .btn-danger:hover { background: rgba(229,115,115,.15); }
  .editor-section {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; margin-bottom: 16px; overflow: hidden;
  }
  .editor-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--table-head);
    border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-dim);
  }
  .editor-header span { color: var(--accent-2); }
  textarea#sql {
    width: 100%; min-height: 120px; padding: 12px;
    background: var(--code-bg); color: var(--text);
    border: none; outline: none; resize: vertical;
    font-family: 'Consolas', 'Monaco', monospace; font-size: 14px;
    line-height: 1.6; tab-size: 2;
  }
  .editor-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--table-head);
    border-top: 1px solid var(--border);
  }
  .limit-group { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  .limit-group input {
    width: 70px; padding: 4px 8px; background: var(--code-bg);
    color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; font-family: inherit;
  }
  .history-section {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; margin-bottom: 16px;
  }
  .history-header {
    padding: 8px 12px; background: var(--table-head);
    border-bottom: 1px solid var(--border); font-size: 12px;
    color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
  }
  .history-list { padding: 8px; max-height: 150px; overflow-y: auto; }
  .history-item {
    padding: 6px 10px; margin-bottom: 4px; background: var(--code-bg);
    border-radius: 3px; font-size: 12px; color: var(--text-soft);
    cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; transition: all .15s;
  }
  .history-item:hover { background: var(--panel-hover); color: var(--accent); }
  .result-section {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
  }
  .result-header {
    padding: 8px 12px; background: var(--table-head);
    border-bottom: 1px solid var(--border); font-size: 12px;
    color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
  }
  .result-info { color: var(--accent-2); }
  .result-meta { color: var(--text-dim); margin-left: 12px; }
  .result-meta .ok { color: var(--success); }
  .result-meta .err { color: var(--error); }
  .table-wrap { overflow-x: auto; max-height: 600px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { position: sticky; top: 0; z-index: 1; }
  th {
    padding: 10px 14px; text-align: left; background: var(--table-head);
    color: var(--accent); font-weight: 600; border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    color: var(--text-soft); white-space: pre-wrap; word-break: break-all;
  }
  tr:hover td { background: var(--panel-hover); color: var(--text); }
  tr:nth-child(even) td { background: var(--table-row-alt); }
  tr:nth-child(even):hover td { background: var(--panel-hover); }
  .null-val { color: var(--text-dim); font-style: italic; }
  .error-box {
    padding: 16px; color: var(--error); font-size: 13px;
    background: rgba(229,115,115,.08); line-height: 1.6;
  }
  .executed-sql {
    margin-top: 8px; padding: 10px; background: var(--code-bg);
    border-radius: 4px; font-size: 12px; color: var(--text-dim);
    border-left: 3px solid var(--accent-2); white-space: pre-wrap; word-break: break-all;
  }
  .executed-sql::before { content: '已执行: '; color: var(--accent-2); }
  .empty { padding: 40px; text-align: center; color: var(--text-dim); font-size: 14px; }
  .shortcut-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .shortcut {
    padding: 3px 10px; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 3px; font-size: 11px; color: var(--text-dim);
    cursor: pointer; transition: all .15s;
  }
  shortcut:hover, .shortcut:hover { color: var(--accent); border-color: var(--accent); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>SQL 查询工具</h1>
    <div class="status"><span class="dot"></span>连接到 springcloud-service (8081)</div>
  </header>

  <!-- 快捷按钮 -->
  <div class="toolbar">
    <div class="shortcut-bar">
      <span class="shortcut" onclick="fillSql('SELECT * FROM user')">查 user 表</span>
      <span class="shortcut" onclick="fillSql('SHOW TABLES FROM springcloud_demo')">列出所有表</span>
      <span class="shortcut" onclick="fillSql('SELECT VERSION()')">MySQL 版本</span>
      <span class="shortcut" onclick="fillSql('SELECT DATABASE()')">当前数据库</span>
      <span class="shortcut" onclick="fillSql('SELECT USER(), CURRENT_USER()')">当前用户</span>
      <span class="shortcut" onclick="fillSql('SELECT * FROM information_schema.tables WHERE table_schema = DATABASE()')">库内表清单</span>
    </div>
  </div>

  <!-- SQL 编辑器 -->
  <div class="editor-section">
    <div class="editor-header">
      <span>SQL 编辑器</span>
      <span id="sqlStatus">就绪</span>
    </div>
    <textarea id="sql" placeholder="输入 SELECT 语句... (Ctrl+Enter 执行)&#10;例如: SELECT * FROM user LIMIT 10"></textarea>
    <div class="editor-footer">
      <div class="limit-group">
        <label>行数限制:</label>
        <input type="number" id="limit" value="100" min="1" max="1000">
        <span>(最大 1000)</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-danger" onclick="clearAll()">清空</button>
        <button class="btn btn-primary" onclick="executeQuery()">执行 (Ctrl+Enter)</button>
      </div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="history-section">
    <div class="history-header">
      <span>查询历史 (本地保存，点击复用)</span>
      <button class="btn" onclick="clearHistory()" style="padding:2px 8px; font-size:11px;">清空历史</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty" style="padding:12px;">暂无历史</div>
    </div>
  </div>

  <!-- 结果 -->
  <div class="result-section">
    <div class="result-header">
      <span class="result-info" id="resultInfo">等待查询</span>
      <span class="result-meta" id="resultMeta"></span>
    </div>
    <div class="table-wrap" id="resultWrap">
      <div class="empty">执行查询后结果将显示在这里</div>
    </div>
  </div>
</div>

<script>
const API_URL = '/api/query';
const HISTORY_KEY = 'sql_query_history';
const MAX_HISTORY = 20;

// Ctrl+Enter 执行
document.getElementById('sql').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    executeQuery();
  }
  // Tab 缩进
  if (e.key === 'Tab') {
    e.preventDefault();
    const t = e.target;
    const start = t.selectionStart, end = t.selectionEnd;
    t.value = t.value.substring(0, start) + '  ' + t.value.substring(end);
    t.selectionStart = t.selectionEnd = start + 2;
  }
});

function fillSql(sql) {
  document.getElementById('sql').value = sql;
  document.getElementById('sql').focus();
}

async function executeQuery() {
  const sql = document.getElementById('sql').value.trim();
  const limitVal = parseInt(document.getElementById('limit').value) || 100;

  if (!sql) {
    showResult(null, null, 'SQL 不能为空');
    return;
  }

  document.getElementById('sqlStatus').textContent = '执行中...';
  document.getElementById('resultInfo').textContent = '执行中...';
  document.getElementById('resultMeta').innerHTML = '';

  const startTs = Date.now();
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql: sql, limit: limitVal })
    });
    const json = await resp.json();
    const clientCost = Date.now() - startTs;

    if (json.code === 200 && json.data) {
      const d = json.data;
      showResult(d.columns, d.rows, null, d.executedSql, d.costMs, d.rowCount, clientCost);
      addHistory(sql);
    } else {
      showResult(null, null, json.message || '查询失败');
    }
  } catch (e) {
    showResult(null, null, '请求失败: ' + e.message);
  }
  document.getElementById('sqlStatus').textContent = '就绪';
}

function showResult(columns, rows, error, executedSql, costMs, rowCount, clientCost) {
  const wrap = document.getElementById('resultWrap');
  const info = document.getElementById('resultInfo');
  const meta = document.getElementById('resultMeta');

  if (error) {
    wrap.innerHTML = '<div class="error-box">' + escapeHtml(error) + '</div>';
    info.textContent = '查询失败';
    meta.innerHTML = '<span class="err">ERROR</span>';
    return;
  }

  if (!columns || columns.length === 0) {
    wrap.innerHTML = '<div class="empty">查询结果为空</div>';
    info.textContent = '无数据';
    meta.innerHTML = '';
    return;
  }

  // 构建表格
  let html = '<table><thead><tr>';
  columns.forEach(c => { html += '<th>' + escapeHtml(c) + '</th>'; });
  html += '</tr></thead><tbody>';
  if (rows && rows.length > 0) {
    rows.forEach(row => {
      html += '<tr>';
      row.forEach(cell => {
        if (cell === null || cell === undefined) {
          html += '<td><span class="null-val">NULL</span></td>';
        } else if (typeof cell === 'object') {
          html += '<td>' + escapeHtml(JSON.stringify(cell)) + '</td>';
        } else {
          html += '<td>' + escapeHtml(String(cell)) + '</td>';
        }
      });
      html += '</tr>';
    });
  } else {
    html += '<tr><td colspan="' + columns.length + '" style="text-align:center; padding:24px; color:var(--text-dim);">无数据行</td></tr>';
  }
  html += '</tbody></table>';

  if (executedSql) {
    html += '<div class="executed-sql">' + escapeHtml(executedSql) + '</div>';
  }

  wrap.innerHTML = html;
  info.textContent = '返回 ' + (rowCount || 0) + ' 行';
  meta.innerHTML = '<span class="ok">OK</span> | 服务端: ' + (costMs || 0) + 'ms | 客户端: ' + (clientCost || 0) + 'ms';
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// 历史
function loadHistory() {
  try {
    const d = localStorage.getItem(HISTORY_KEY);
    return d ? JSON.parse(d) : [];
  } catch { return []; }
}

function addHistory(sql) {
  let h = loadHistory();
  // 去重
  h = h.filter(x => x !== sql);
  h.unshift(sql);
  if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  renderHistory();
}

function renderHistory() {
  const h = loadHistory();
  const el = document.getElementById('historyList');
  if (h.length === 0) {
    el.innerHTML = '<div class="empty" style="padding:12px;">暂无历史</div>';
    return;
  }
  el.innerHTML = h.map((sql, i) =>
    '<div class="history-item" onclick="useHistory(' + i + ')" title="' + escapeHtml(sql) + '">'
    + escapeHtml(sql.length > 100 ? sql.substring(0, 100) + '...' : sql) + '</div>'
  ).join('');
}

function useHistory(i) {
  const h = loadHistory();
  if (h[i]) {
    document.getElementById('sql').value = h[i];
    document.getElementById('sql').focus();
  }
}

function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

function clearAll() {
  document.getElementById('sql').value = '';
  document.getElementById('resultWrap').innerHTML = '<div class="empty">执行查询后结果将显示在这里</div>';
  document.getElementById('resultInfo').textContent = '等待查询';
  document.getElementById('resultMeta').innerHTML = '';
}

// 初始化
renderHistory();
</script>
</body>
</html>
