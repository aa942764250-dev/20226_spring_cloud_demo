# 开发环境 (dev namespace) —— 远程 Nacos 服务发现 + lb 路由
spring:
  cloud:
    nacos:
      discovery:
        server-addr: 154.201.68.122:8848
        namespace: dev
        username: nacos
        password: nacos
        fail-fast: false
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: workbench-route
          uri: lb://workbench-service
          predicates:
            - Path=/api/wb/**
          filters:
            - StripPrefix=1
        - id: ai-teacher-route
          uri: lb://ai-teacher-service
          predicates:
            - Path=/api/ai-teacher/**
          filters:
            - StripPrefix=1
        - id: service-route
          uri: lb://springcloud-service
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1
