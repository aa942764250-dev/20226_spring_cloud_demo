server:
  port: 8080

spring:
  application:
    name: springcloud-gateway
  profiles:
    active: dev
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      # 路由按 profile 定义：application-dev.yml(远程 Nacos lb) / application-local.yml(本地直连)
gateway:
  jwt:
    secret: workbench-secret-key-must-be-at-least-256-bits-long-please-change
