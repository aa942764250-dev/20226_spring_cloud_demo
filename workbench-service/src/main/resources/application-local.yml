# 本地自包含联调 (local profile) —— H2 内存库 + 关闭 Nacos
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:workbench;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-workbench.sql
      data-locations: classpath:db/data-workbench.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
workbench:
  jwt:
    secret: workbench-secret-key-must-be-at-least-256-bits-long-please-change
    expire-hours: 24
