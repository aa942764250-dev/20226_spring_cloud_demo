# 本地自包含联调 (local profile) —— H2 内存库 + 关闭 Nacos
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ai_teacher;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/init_ai_teacher_tables.sql
      data-locations: classpath:db/data-ai-teacher.sql
ai-teacher:
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: gemini-2.5-flash
  timeout-seconds: 60
  max-retries: 2
  default-teacher-id: 1
