server:
  port: 8084

spring:
  application:
    name: ai-teacher-service
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.example.service: debug

ai-teacher:
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: gemini-2.5-flash
  timeout-seconds: 180
  max-retries: 2
  default-teacher-id: 1
  # Embedding 配置（知识库检索用，硅基流动 bge-m3 免费）
  embedding-api-url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
  embedding-api-key: ${EMBEDDING_API_KEY:}
  embedding-model: ${EMBEDDING_MODEL:BAAI/bge-m3}

# 教材原文图片根目录：本地 dev 用默认值（Windows 正斜杠路径合法）；
# Docker 容器通过环境变量 TEXTBOOK_IMAGE_BASE_DIR=/data/textbook 覆盖。
textbook:
  image-base-dir: ${TEXTBOOK_IMAGE_BASE_DIR:D:/Workspace/Project_010_英语知识库/data/教材原文}
